base_url: https://api.openai.com/v1
api_key: ""
model: deepseek-v4-flash
temperature: 0.7
# API 协议：responses（默认，OpenAI Responses API 兼容格式，思维链明文回传）/ chat（第三方兼容端点）
# 仅提供 /chat/completions 的端点（Ollama/vLLM 等）遇 404 时改为 chat
# api_protocol: responses
# 思考等级，随请求发送 OpenAI 标准字段：minimal / low / medium / high / max
# 留空或注释则不发送；REPL 内 /think 可运行时切换
# 设置后请求不再发送 temperature（兼容 o 系/gpt-5 等仅支持 temperature=1 的推理模型）
# reasoning_effort: medium
# 思维链显示（仅 yaml，默认关闭）：开启后思维链以 markdown 渲染，并夹在 `─── 思考 ───` / `─── 思考结束 · 3.2s ───` 分隔符之间，
# 同时不再打印 `» 思考中` 状态行（`» 等待响应` 在首个思维链片段到达时收尾）
# 仅 REPL 的 rich 输出档生效（stdout 非终端 / -p / ask 一律不显示），REPL 内 /reasoning on|off 可运行时切换
# show_reasoning: false

# 终端提示音（仅 yaml，默认关闭）：对话回合结束（成功与报错都响，^C 中断不响）与 run_shell 声明 interactive、
# 等待终端输入时各响一声；铃声直接写控制终端（/dev/tty），不进 stdout、不受 -p 与重定向影响
# 仅 REPL 的 rich 输出档生效，ask 单发不参与
# bell: false

# 出站请求 User-Agent（伪装，避免厂商风控）
user_agent: "pi/0.85.0 (linux; node/v22.14.0; x64)"
# REPL 提示符为内置固定模板（不可配），占位符按口径分两组（加 _total 后缀即本次运行累计，无后缀即最近一次请求）：{cwd} 短路径 / {model} 模型 / {effort} 思考等级 / {usage} 上下文用量 / {cache} 本次命中量 / {cache_rate} 本次命中率 / {usage_total} 累计用量 / {cache_total} 累计命中量 / {cache_rate_total} 累计命中率 / {usage_summary} 组合显示（混合口径，{usage} 其后有累计缓存数据时追加累计命中率；与 /stat 命令不同源）
# 数据根目录（env TANYA_DATA_DIR）：global 模式的会话落于 <data_dir>/workspaces/<workspace-id>/{sessions,archive}/
data_dir: ~/.local/share/tanya
# 会话存储模式：auto（默认，存在 .tanya/ 则 local）/ local / global
session_mode: auto
# 启动自动归档（仅 REPL 且需控制终端确认，ask 单发与非交互一律不问；仅配置文件，无 env）
# 默认开启：启动时若活跃会话数达到阈值，提示是否归档较早的会话（y/yes 归档，其它输入取消）
# 设 false 关闭启动询问（仍可随时 /archive 手动归档）
# auto_archive: true
# 触发阈值：活跃会话数达到该值才提示，需 >= 2（默认 64）
# auto_archive_threshold: 64
# 归档后保留的最近活跃会话数，需 >= 0 且小于阈值（默认 16；0 = 除当前会话外全部归档）
# 同时作为 /archive 无参时的默认保留数量
# auto_archive_keep: 16

# 终端配色：auto（默认，跟随终端能力与 NO_COLOR）/ on（强制开色）/ off（强制纯文本）
# colors: auto
# 内置配色主题（影响语义色/提示符/markdown 标题与代码色，REPL 内 /theme 可切换）：
# default 默认（蓝绿黄高亮） / minimal 克制灰阶 / solar 冷暖青金（低饱和护眼） / vivid 高对比霓虹
# nord 冷蓝灰 / gruv 暖金复古 / dusk 蓝紫夜
# theme: nord
# 语义色覆盖：叠加在当前主题之上（仅影响状态行/等待动画/菜单选中等 UI 色，提示符随主题不受影响）
# 可覆盖的语义色：info / warn / ok / error / dim / accent / think / run
# 可用色名：black red green yellow blue magenta cyan white 与 bright_ 前缀亮色
# palette:
#   info: bright_cyan
#   error: bright_red

# 工具输出在终端最多显示的行数（run_shell 超出后仅显示头 3 行 + 尾 2 行与总数提示，其余工具只保留前 N 行并附总行数），范围 1-1000
tool_output_lines: 20

# run_shell 使用的 shell：名字或绝对路径（如 zsh、/usr/bin/fish），缺省自动探测
# Windows 依次尝试 pwsh → powershell（Windows PowerShell 5.1 兜底）；Linux/macOS 依次尝试 bash → sh → ash；全部落空（含配置的 shell 不存在）则启动报错退出
# shell: bash
