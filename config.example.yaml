base_url: https://api.openai.com/v1
api_key: ""
model: deepseek-v4-flash
temperature: 0.7
# 出站请求 User-Agent（伪装，避免厂商风控）
user_agent: "pi/0.85.0 (linux; node/v22.14.0; x64)"
# REPL 提示符为内置固定模板（不可配），占位符：{cwd} 短路径 / {model} 模型 / {usage} 上下文 token / {cache} 缓存命中 / {cache_rate} 缓存命中率 / {stat} 组合用量（无缓存=总量，有缓存=缓存/总量 命中率）
# global 模式会话基础目录，实际存放于 <global_session>/<workspace-id>/
global_session: ~/.local/share/tanyan/sessions
# 会话存储模式：auto（默认，存在 .tanya/ 则 local）/ local / global
session_mode: auto

# 工具输出在终端最多显示的行数（超出后仅显示头 3 行 + 尾 2 行与总数提示），范围 1-1000
tool_output_lines: 20

# run_shell 使用的 shell：名字或绝对路径（如 zsh、/usr/bin/fish），缺省自动探测
# Windows 仅用 pwsh；Linux/macOS 依次尝试 bash → sh → ash；找不到则不注册 run_shell
# shell: bash
